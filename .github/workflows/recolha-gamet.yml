name: Recolha GAMET LPPC

on:
  schedule:
    # Duas vezes por hora (aos :23 e aos :53). O GitHub trata os agendamentos
    # como "melhor esforço" e atrasa ou salta execuções: a 14/15-out-2026 o
    # cron horário só correu às 22:19Z, 00:36Z e 05:56Z. Um AMD/COR emitido e
    # substituído dentro de um buraco desses perdia-se. Minutos fora da hora
    # certa (:00) porque é aí que o GitHub tem mais carga.
    - cron: "23,53 * * * *"
  workflow_dispatch:         # permite correr à mão no separador Actions
    inputs:
      guardar_pagina:
        description: "Guardar também a página do IPMA tal como vem (diagnóstico)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: recolha-gamet
  cancel-in-progress: false

jobs:
  recolher:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Código (main)
        uses: actions/checkout@v4
      - name: Dados (ramo dados)
        uses: actions/checkout@v4
        with:
          ref: dados
          path: dados
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - name: Recolher
        env:
          GAMET_DIR: dados/gamets
          GUARDAR_PAGINA: ${{ inputs.guardar_pagina && '1' || '0' }}
        run: python scripts/recolher_gamet.py
      - name: Guardar no ramo dados
        working-directory: dados
        run: |
          git config user.name  "recolha-gamet"
          git config user.email "recolha-gamet@users.noreply.github.com"
          git add -A .
          if git diff --cached --quiet; then
            echo "Nada de novo."
          else
            git commit -m "Recolha $(date -u +%Y-%m-%dT%H:%MZ)"
            git pull --rebase --autostash
            git push
          fi
