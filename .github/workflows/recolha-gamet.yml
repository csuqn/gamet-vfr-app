name: Recolha GAMET LPPC

on:
  schedule:
    - cron: "17 * * * *"     # de hora a hora (apanha emendas AMD/COR)
  workflow_dispatch: {}      # permite correr à mão no separador Actions

permissions:
  contents: write

concurrency:
  group: recolha-gamet
  cancel-in-progress: false

jobs:
  recolher:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Código (main)
        uses: actions/checkout@v4
      - name: Dados (ramo dados)
        uses: actions/checkout@v4
        with:
          ref: dados
          path: dados
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - name: Recolher
        env:
          GAMET_DIR: dados/gamets
        run: python scripts/recolher_gamet.py
      - name: Guardar no ramo dados
        working-directory: dados
        run: |
          git config user.name  "recolha-gamet"
          git config user.email "recolha-gamet@users.noreply.github.com"
          git add gamets
          if git diff --cached --quiet; then
            echo "Nada de novo."
          else
            git commit -m "GAMET $(date -u +%Y-%m-%dT%H:%MZ)"
            git pull --rebase --autostash
            git push
          fi
