name: Publicar protótipo NiceGUI (Hugging Face)

# Publica o protótipo NiceGUI num Space do Hugging Face sempre que o ramo
# prototipo/nicegui muda. Não toca na app Streamlit (ramo main).
#
# Precisa de duas coisas no repositório (Settings → Secrets and variables →
# Actions), postas pelo dono da conta:
#   - secret   HF_TOKEN : token do Hugging Face com permissão de escrita
#   - variable HF_SPACE : "<utilizador>/<nome-do-space>"
on:
  push:
    branches: [prototipo/nicegui]
  workflow_dispatch:

jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Preparar o conteúdo do Space
        run: |
          mkdir -p space/tests space/nicegui_app
          cp app.py space/
          cp tests/conftest.py space/tests/
          cp nicegui_app/*.py nicegui_app/requirements.txt space/nicegui_app/
          cp nicegui_app/Dockerfile space/Dockerfile
          cat > space/README.md <<'MD'
          ---
          title: LPPC GAMET VFR
          emoji: ✈️
          colorFrom: blue
          colorTo: gray
          sdk: docker
          app_port: 7860
          pinned: false
          ---
          Protótipo NiceGUI do descodificador de GAMET LPPC. Código e testes:
          https://github.com/csuqn/gamet-vfr-app (ramo prototipo/nicegui).
          Ferramenta de apoio à decisão — não substitui o briefing oficial.
          MD
          sed -i 's/^          //' space/README.md
      - name: Enviar para o Hugging Face
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_SPACE: ${{ vars.HF_SPACE }}
        run: |
          if [ -z "$HF_TOKEN" ] || [ -z "$HF_SPACE" ]; then
            echo "::error::Falta o secret HF_TOKEN ou a variable HF_SPACE."; exit 1
          fi
          cd space
          git init -q -b main
          git config user.name "publicar-nicegui"
          git config user.email "publicar-nicegui@users.noreply.github.com"
          git add -A
          git commit -q -m "Publicação de ${GITHUB_SHA::7}"
          git push -q --force "https://user:${HF_TOKEN}@huggingface.co/spaces/${HF_SPACE}" main
